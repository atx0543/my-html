<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS 翻訳 — 日⇄英 AI Translator</title>
<script>
  // テーマのちらつき防止（描画前に適用）
  (() => {
    const saved = localStorage.getItem('nexus_theme');
    const theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = theme;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ===== Theme variables ===== */
  :root, [data-theme="dark"]{
    --bg:#05060f;
    --panel:rgba(18,22,44,.55);
    --panel-solid:#12162c;
    --border:rgba(140,160,255,.18);
    --text:#e8ebff;
    --muted:#8a90b8;
    --placeholder:#4f5580;
    --foot:rgba(5,6,15,.35);
    --soft:rgba(255,255,255,.04);
    --soft-hover:rgba(255,255,255,.09);
    --grid-line:rgba(120,140,255,.06);
    --track:#2a2f52;
    --shadow:rgba(0,0,0,.45);
    --blob-opacity:.45;
    --accent:#22e6ff;
    --cyan:#22e6ff;
    --violet:#8b5cff;
    --pink:#ff4fd8;
    --green:#3dffa8;
    --red:#ff4d6d;
    --grad:linear-gradient(135deg,var(--cyan),var(--violet) 55%,var(--pink));
  }
  [data-theme="light"]{
    --bg:#eef1fb;
    --panel:rgba(255,255,255,.68);
    --panel-solid:#ffffff;
    --border:rgba(90,100,180,.2);
    --text:#1a1d3a;
    --muted:#5d6390;
    --placeholder:#a3a8c9;
    --foot:rgba(240,243,255,.7);
    --soft:rgba(20,30,90,.04);
    --soft-hover:rgba(20,30,90,.08);
    --grid-line:rgba(80,100,200,.08);
    --track:#c9cde6;
    --shadow:rgba(60,70,140,.15);
    --blob-opacity:.28;
    --accent:#0a8fb0;
    --green:#0fa968;
    --red:#e5244a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Noto Sans JP","Space Grotesk",system-ui,sans-serif;
    background:var(--bg);color:var(--text);
    overflow-x:hidden;min-height:100vh;
    display:flex;flex-direction:column;
    transition:background .4s,color .4s;
  }
  /* ===== Animated background ===== */
  .bg{position:fixed;inset:0;z-index:-2;overflow:hidden}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:var(--blob-opacity);animation:float 22s ease-in-out infinite;transition:opacity .4s}
  .b1{width:520px;height:520px;background:var(--violet);top:-160px;left:-120px}
  .b2{width:460px;height:460px;background:var(--cyan);bottom:-180px;right:-100px;animation-delay:-7s}
  .b3{width:360px;height:360px;background:var(--pink);top:40%;left:45%;opacity:calc(var(--blob-opacity) * .55);animation-delay:-14s}
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(80px,60px) scale(1.1)}
    66%{transform:translate(-60px,40px) scale(.95)}
  }
  .grid{position:fixed;inset:0;z-index:-1;
    background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),
                     linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);
  }

  /* ===== Header ===== */
  header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:22px clamp(16px,4vw,48px);
  }
  .logo{display:flex;align-items:center;gap:14px}
  .logo-mark{
    width:46px;height:46px;border-radius:14px;background:var(--grad);
    display:grid;place-items:center;font-weight:700;font-size:20px;color:#fff;
    box-shadow:0 0 30px rgba(139,92,255,.6);
  }
  .logo h1{font-family:"Space Grotesk",sans-serif;font-size:22px;letter-spacing:.12em}
  .logo h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .logo small{display:block;color:var(--muted);font-size:11px;letter-spacing:.2em;margin-top:2px}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .chip{
    display:flex;align-items:center;gap:8px;
    background:var(--panel);border:1px solid var(--border);
    padding:8px 14px;border-radius:999px;font-size:13px;color:var(--muted);
    backdrop-filter:blur(14px);
  }
  .chip select{background:transparent;border:none;color:var(--text);font:inherit;outline:none;cursor:pointer}
  .chip select option{background:var(--panel-solid);color:var(--text)}
  .chip-btn{cursor:pointer;color:var(--text);font:500 13px "Noto Sans JP",sans-serif;transition:.2s}
  .chip-btn:hover{border-color:var(--accent);box-shadow:0 0 16px rgba(34,230,255,.2)}
  .chip-btn svg{width:16px;height:16px}
  .badge{
    min-width:20px;padding:1px 6px;border-radius:999px;background:var(--grad);color:#fff;
    font:700 11px "Space Grotesk",sans-serif;text-align:center;
  }
  /* theme toggle icons */
  .theme-btn{padding:8px 10px}
  .theme-btn .sun{display:none}
  [data-theme="dark"] .theme-btn .sun{display:block}
  [data-theme="dark"] .theme-btn .moon{display:none}
  [data-theme="light"] .theme-btn .moon{display:block}

  /* ===== Email (MyMemory) ===== */
  .email-chip input{
    width:210px;background:var(--soft);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font:13px "Space Grotesk","Noto Sans JP",sans-serif;padding:5px 10px;outline:none;transition:.2s;
  }
  .email-chip input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,230,255,.15)}
  .email-chip input.invalid{border-color:var(--pink)}
  .email-chip button{
    background:var(--grad);border:none;color:#fff;font:600 12px "Noto Sans JP",sans-serif;
    padding:6px 12px;border-radius:8px;cursor:pointer;transition:.2s;
  }
  .email-chip button:hover{box-shadow:0 0 16px rgba(139,92,255,.6)}
  .email-chip button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
  .email-status{font-size:11px;font-family:"Space Grotesk",sans-serif;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .email-status.on{color:var(--green);background:rgba(61,255,168,.1);border:1px solid rgba(61,255,168,.35)}
  .email-status.off{color:var(--muted);background:var(--soft);border:1px solid var(--border)}
  .switch{position:relative;width:38px;height:20px;cursor:pointer}
  .switch input{display:none}
  .switch .track{position:absolute;inset:0;border-radius:999px;background:var(--track);transition:.3s}
  .switch .track::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.3s}
  .switch input:checked + .track{background:var(--grad)}
  .switch input:checked + .track::after{transform:translateX(18px)}

  /* ===== Direction bar ===== */
  .direction{
    display:flex;align-items:center;justify-content:center;gap:18px;
    margin:4px auto 18px;font-family:"Space Grotesk","Noto Sans JP",sans-serif;
  }
  .lang-pill{
    min-width:140px;text-align:center;padding:10px 20px;border-radius:14px;
    background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(14px);
    font-weight:500;letter-spacing:.05em;transition:.4s;
  }
  .lang-pill.active{border-color:rgba(34,230,255,.6);box-shadow:0 0 24px rgba(34,230,255,.25)}
  .arrow{
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    background:var(--grad);box-shadow:0 0 24px rgba(139,92,255,.5);
  }
  .detect-tag{font-size:10px;color:var(--accent);display:block;letter-spacing:.2em;margin-bottom:2px}

  /* ===== Main panels ===== */
  main{
    flex:1;display:grid;grid-template-columns:1fr 1fr;gap:22px;
    padding:0 clamp(16px,4vw,48px) 24px;
  }
  .panel{
    position:relative;display:flex;flex-direction:column;
    background:var(--panel);border:1px solid var(--border);border-radius:24px;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    overflow:hidden;min-height:440px;
    box-shadow:0 20px 60px var(--shadow),inset 0 1px 0 rgba(255,255,255,.06);
    transition:border-color .3s, box-shadow .3s, background .4s;
  }
  .panel:focus-within{border-color:rgba(139,92,255,.6);box-shadow:0 20px 60px var(--shadow),0 0 0 4px rgba(139,92,255,.12)}
  .panel.recording{border-color:rgba(255,77,109,.7);box-shadow:0 20px 60px var(--shadow),0 0 0 4px rgba(255,77,109,.15)}
  .panel::before{
    content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad);opacity:.8;
  }
  .panel-head{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:16px 22px;border-bottom:1px solid var(--border);
    font-size:12px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;
  }
  .panel-head b{color:var(--text);font-weight:500;letter-spacing:.1em}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:8px;box-shadow:0 0 10px var(--green)}
  .rec-indicator{display:none;align-items:center;gap:6px;color:var(--red);font-weight:700;letter-spacing:.15em}
  .rec-indicator::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:pulse 1s infinite}
  .panel.recording .rec-indicator{display:inline-flex}
  textarea,.output{
    flex:1;width:100%;padding:22px;background:transparent;border:none;outline:none;resize:none;
    color:var(--text);font-family:inherit;font-size:18px;line-height:1.8;
  }
  textarea::placeholder{color:var(--placeholder)}
  .output{overflow-y:auto;white-space:pre-wrap;word-break:break-word}
  .output.placeholder{color:var(--placeholder)}
  .panel-foot{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:14px 18px;border-top:1px solid var(--border);background:var(--foot);
  }
  .count{margin-left:auto;font-size:12px;color:var(--muted);font-family:"Space Grotesk",sans-serif}

  /* ===== Buttons ===== */
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 16px;border-radius:12px;cursor:pointer;
    background:var(--soft);border:1px solid var(--border);color:var(--text);
    font:500 14px "Noto Sans JP",sans-serif;transition:.2s;
  }
  .btn:hover{background:var(--soft-hover);border-color:rgba(34,230,255,.5);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn svg{width:18px;height:18px;flex-shrink:0}
  .btn.speaking{border-color:var(--pink);color:var(--pink);box-shadow:0 0 18px rgba(255,79,216,.35)}
  .btn.speaking svg{animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.4}}
  .btn-primary{
    background:var(--grad);border:none;color:#fff;font-weight:700;padding:12px 26px;
    box-shadow:0 8px 30px rgba(139,92,255,.45);position:relative;overflow:hidden;
  }
  .btn-primary::after{
    content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
    transform:skewX(-20deg);transition:.6s;
  }
  .btn-primary:hover{background:var(--grad);box-shadow:0 10px 40px rgba(139,92,255,.7)}
  .btn-primary:hover::after{left:140%}
  .btn-primary:disabled{opacity:.6;cursor:wait}
  .icon-btn{padding:10px;border-radius:10px}

  /* ===== Mic (voice input) ===== */
  .mic-group{display:inline-flex;align-items:stretch;border-radius:12px;overflow:hidden;border:1px solid var(--border);transition:.2s}
  .mic-group .btn{border:none;border-radius:0}
  .mic-group select{
    background:var(--soft);color:var(--text);border:none;border-left:1px solid var(--border);
    font:500 12px "Noto Sans JP",sans-serif;padding:0 8px;outline:none;cursor:pointer;
  }
  .mic-group select option{background:var(--panel-solid);color:var(--text)}
  .mic-group:hover{border-color:rgba(34,230,255,.5)}
  .mic-group.listening{border-color:var(--red);box-shadow:0 0 0 0 rgba(255,77,109,.6);animation:micRing 1.4s infinite}
  .mic-group.listening .btn{color:var(--red);background:rgba(255,77,109,.1)}
  @keyframes micRing{
    0%{box-shadow:0 0 0 0 rgba(255,77,109,.55)}
    100%{box-shadow:0 0 0 14px rgba(255,77,109,0)}
  }

  /* ===== Loading ===== */
  .loader{
    position:absolute;inset:58px 0 66px 0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:16px;background:var(--foot);backdrop-filter:blur(3px);
  }
  .loader.show{display:flex}
  .ring{width:54px;height:54px;border-radius:50%;
    background:conic-gradient(var(--cyan),var(--violet),var(--pink),transparent 75%);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 0);
            mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 0);
    animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader p{font-size:12px;letter-spacing:.3em;color:var(--accent)}

  .engine-badge{font-size:11px;color:var(--muted);font-family:"Space Grotesk",sans-serif}
  .engine-badge em{color:var(--accent);font-style:normal}

  /* ===== History drawer ===== */
  .overlay{position:fixed;inset:0;background:rgba(5,6,15,.45);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s;z-index:50}
  .overlay.show{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:60;
    background:var(--panel-solid);border-left:1px solid var(--border);
    box-shadow:-20px 0 60px var(--shadow);
    transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);
    display:flex;flex-direction:column;
  }
  .drawer.open{transform:translateX(0)}
  .drawer::before{content:"";position:absolute;top:0;left:0;bottom:0;width:2px;background:var(--grad)}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 14px}
  .drawer-head h2{font:700 18px "Space Grotesk","Noto Sans JP",sans-serif;letter-spacing:.08em}
  .drawer-head h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .search{
    margin:0 22px 12px;display:flex;align-items:center;gap:8px;
    background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:9px 12px;
  }
  .search:focus-within{border-color:var(--accent)}
  .search svg{width:16px;height:16px;color:var(--muted)}
  .search input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font:14px "Noto Sans JP",sans-serif}
  .search input::placeholder{color:var(--placeholder)}
  .h-list{flex:1;overflow-y:auto;padding:4px 22px 16px;display:flex;flex-direction:column;gap:10px}
  .h-item{
    position:relative;padding:14px 14px 12px;border-radius:14px;cursor:pointer;
    background:var(--soft);border:1px solid var(--border);transition:.2s;
  }
  .h-item:hover{border-color:rgba(34,230,255,.5);background:var(--soft-hover);transform:translateX(-2px)}
  .h-meta{display:flex;align-items:center;gap:8px;font:11px "Space Grotesk",sans-serif;color:var(--muted);margin-bottom:6px}
  .h-dir{padding:1px 8px;border-radius:999px;background:var(--grad);color:#fff;font-weight:700;letter-spacing:.05em}
  .h-src,.h-out{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.6;word-break:break-word}
  .h-out{color:var(--accent);margin-top:4px}
  .h-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:.2s}
  .h-item:hover .h-actions{opacity:1}
  .h-actions button{
    width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--panel-solid);
    color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.2s;
  }
  .h-actions button:hover{color:var(--text);border-color:var(--accent)}
  .h-actions button.del:hover{color:var(--red);border-color:var(--red)}
  .h-actions svg{width:14px;height:14px}
  .h-empty{text-align:center;color:var(--placeholder);padding:60px 10px;font-size:14px;line-height:2}
  .h-empty .big{font-size:40px;display:block;margin-bottom:6px}
  .drawer-foot{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
  .btn-danger{padding:8px 14px;font-size:13px}
  .btn-danger:hover{border-color:var(--red);color:var(--red)}

  /* ===== Toast ===== */
  .toast{
    position:fixed;bottom:28px;left:50%;transform:translate(-50%,30px);opacity:0;
    background:var(--panel-solid);border:1px solid rgba(34,230,255,.5);color:var(--text);
    padding:12px 22px;border-radius:12px;font-size:14px;transition:.35s;pointer-events:none;
    box-shadow:0 10px 40px var(--shadow);z-index:99;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  footer{text-align:center;color:var(--placeholder);font-size:11px;letter-spacing:.15em;padding:0 0 18px}
  kbd{background:var(--soft-hover);border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-family:"Space Grotesk";font-size:11px}

  @media (max-width:860px){
    main{grid-template-columns:1fr}
    .panel{min-height:320px}
    header{flex-direction:column;align-items:flex-start}
    .controls{justify-content:flex-start}
    .h-actions{opacity:1}
  }
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="grid"></div>

<header>
  <div class="logo">
    <div class="logo-mark">訳</div>
    <div>
      <h1><span>NEXUS</span> 翻訳</h1>
      <small>JAPANESE ⇄ ENGLISH TRANSLATOR</small>
    </div>
  </div>
  <div class="controls">
    <div class="chip">
      エンジン
      <select id="engine">
        <option value="google">Google（高精度）</option>
        <option value="mymemory">MyMemory</option>
      </select>
    </div>
    <div class="chip email-chip" title="MyMemoryにメールを登録すると1日の無料上限が 5,000 → 50,000 文字に増えます">
      ✉ MyMemory
      <input type="email" id="mmEmail" placeholder="メールアドレスを入力" autocomplete="email">
      <button id="mmSave">登録</button>
      <button id="mmRemove" class="ghost" style="display:none">解除</button>
      <span class="email-status off" id="mmStatus">5,000字/日</span>
    </div>
    <div class="chip">
      読み上げ速度
      <select id="rate">
        <option value="0.8">0.8x</option>
        <option value="1" selected>1.0x</option>
        <option value="1.2">1.2x</option>
        <option value="1.5">1.5x</option>
      </select>
    </div>
    <div class="chip" title="Opera・Brave・Firefox などでは Whisper（ブラウザ内AI）で音声認識します">
      🎤 音声認識
      <select id="srEngine">
        <option value="auto">自動（推奨）</option>
        <option value="native">ブラウザ標準（Chrome/Edge）</option>
        <option value="whisper-tiny">Whisper 軽量（約40MB）</option>
        <option value="whisper-base">Whisper 標準（約80MB）</option>
        <option value="whisper-small">Whisper 高精度（約250MB）</option>
      </select>
    </div>
    <div class="chip">
      自動翻訳
      <label class="switch"><input type="checkbox" id="autoToggle" checked><span class="track"></span></label>
    </div>
    <button class="chip chip-btn" id="historyBtn" title="翻訳履歴 (Ctrl+H)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 3"/></svg>
      履歴 <span class="badge" id="historyCount">0</span>
    </button>
    <button class="chip chip-btn theme-btn" id="themeBtn" title="ライト／ダーク切替">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div class="direction">
  <div class="lang-pill" id="srcPill"><span class="detect-tag">AUTO DETECT</span><span id="srcName">言語を自動検出</span></div>
  <div class="arrow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  <div class="lang-pill" id="tgtPill"><span class="detect-tag">TRANSLATE TO</span><span id="tgtName">—</span></div>
</div>

<main>
  <!-- ===== LEFT: Source ===== -->
  <section class="panel" id="srcPanel">
    <div class="panel-head">
      <span><span class="dot"></span><b>原文</b> &nbsp;SOURCE</span>
      <span class="rec-indicator" id="recText">REC 録音中…</span>
      <span id="srcLangTag">AUTO</span>
    </div>
    <textarea id="source" placeholder="ここに日本語または英語を入力・貼り付け・音声入力…&#10;Type, paste or speak Japanese or English…" spellcheck="false"></textarea>
    <div class="loader" id="srcLoader"><div class="ring"></div><p id="srcLoaderText">文字起こし中…</p></div>
    <div class="panel-foot">
      <div class="mic-group" id="micGroup">
        <button class="btn" id="micBtn" title="音声入力（マイク）">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>
          <span id="micLabel">音声入力</span>
        </button>
        <select id="micLang" title="話す言語">
          <option value="ja-JP">日本語</option>
          <option value="en-US">English</option>
        </select>
      </div>
      <button class="btn" id="speakSrcBtn" title="原文を音声で聴く">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        音声で聴く
      </button>
      <button class="btn" id="pasteBtn" title="クリップボードから貼り付け">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></svg>
        貼り付け
      </button>
      <button class="btn" id="clearBtn" title="クリア">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        クリアー
      </button>
      <button class="btn btn-primary" id="translateBtn" title="翻訳 (Ctrl+Enter)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg>
        翻訳
      </button>
      <span class="count" id="srcCount">0 文字</span>
    </div>
  </section>

  <!-- ===== RIGHT: Translation ===== -->
  <section class="panel">
    <div class="panel-head">
      <span><span class="dot" style="background:var(--cyan);box-shadow:0 0 10px var(--cyan)"></span><b>翻訳</b> &nbsp;TRANSLATION</span>
      <span class="engine-badge" id="engineBadge">READY</span>
    </div>
    <div class="output placeholder" id="output">翻訳結果がここに表示されます…</div>
    <div class="loader" id="loader"><div class="ring"></div><p>TRANSLATING</p></div>
    <div class="panel-foot">
      <button class="btn icon-btn" id="speakTgtBtn" title="翻訳を音声で聴く">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
      </button>
      <button class="btn icon-btn" id="copyBtn" title="翻訳をコピー">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
      <span class="count" id="tgtCount">0 文字</span>
    </div>
  </section>
</main>

<footer><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 翻訳 ・ <kbd>Ctrl</kbd> + <kbd>M</kbd> 音声入力 ・ <kbd>Ctrl</kbd> + <kbd>H</kbd> 履歴 ・ 日本語／英語を自動判別</footer>

<!-- ===== History drawer ===== -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="翻訳履歴">
  <div class="drawer-head">
    <h2><span>HISTORY</span> 翻訳履歴</h2>
    <button class="btn icon-btn" id="closeDrawer" title="閉じる (Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="text" id="historySearch" placeholder="履歴を検索…">
  </div>
  <div class="h-list" id="historyList"></div>
  <div class="drawer-foot">
    <span id="historyInfo">0 件</span>
    <button class="btn btn-danger" id="clearHistory">すべて削除</button>
  </div>
</aside>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const source = $('source'), output = $('output'), loader = $('loader');
  const translateBtn = $('translateBtn');
  let lastResult = { text: '', lang: 'en' };
  let debounceTimer = null, requestId = 0;

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
  }

  /* ---------- Theme (ライト／ダーク) ---------- */
  $('themeBtn').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('nexus_theme', next);
    toast(next === 'light' ? '☀ ライトモード' : '🌙 ダークモード');
  });

  /* ---------- Language detection ---------- */
  function detectLang(text) {
    const ja = (text.match(/[\u3040-\u30ff\u3400-\u9fff\uff66-\uff9f\u3000-\u303f]/g) || []).length;
    const latin = (text.match(/[A-Za-z]/g) || []).length;
    if (!ja && !latin) return null;
    // 日本語1文字は英字約4文字分の情報量とみなす
    return ja > 0 && ja * 4 >= latin ? 'ja' : 'en';
  }
  const NAMES = { ja: '日本語', en: 'English' };

  function updateDirection() {
    const lang = detectLang(source.value);
    $('srcPill').classList.toggle('active', !!lang);
    $('tgtPill').classList.toggle('active', !!lang);
    if (!lang) {
      $('srcName').textContent = '言語を自動検出';
      $('tgtName').textContent = '—';
      $('srcLangTag').textContent = 'AUTO';
    } else {
      $('srcName').textContent = NAMES[lang];
      $('tgtName').textContent = NAMES[lang === 'ja' ? 'en' : 'ja'];
      $('srcLangTag').textContent = lang.toUpperCase();
    }
    $('srcCount').textContent = source.value.length.toLocaleString() + ' 文字';
    return lang;
  }

  /* ---------- Chunking (長文対応) ---------- */
  function chunkText(text, max) {
    const parts = text.split(/(?<=[。．！？!?.\n])/);
    const chunks = []; let cur = '';
    for (const p of parts) {
      if (p.length > max) {
        if (cur) { chunks.push(cur); cur = ''; }
        for (let i = 0; i < p.length; i += max) chunks.push(p.slice(i, i + max));
      } else if ((cur + p).length > max) {
        chunks.push(cur); cur = p;
      } else cur += p;
    }
    if (cur) chunks.push(cur);
    return chunks;
  }

  /* ---------- MyMemory email registration ---------- */
  const EMAIL_KEY = 'nexus_mymemory_email';
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function refreshEmailUI() {
    const email = localStorage.getItem(EMAIL_KEY);
    const input = $('mmEmail'), status = $('mmStatus');
    input.value = email || '';
    input.classList.remove('invalid');
    $('mmRemove').style.display = email ? '' : 'none';
    $('mmSave').textContent = email ? '更新' : '登録';
    status.className = 'email-status ' + (email ? 'on' : 'off');
    status.textContent = email ? '✔ 50,000字/日' : '5,000字/日';
  }
  function saveEmail() {
    const input = $('mmEmail');
    const v = input.value.trim();
    if (!EMAIL_RE.test(v)) {
      input.classList.add('invalid');
      return toast('⚠ 正しいメールアドレスを入力してください');
    }
    localStorage.setItem(EMAIL_KEY, v);
    refreshEmailUI();
    toast('✉ 登録しました — MyMemory 上限 50,000字/日');
  }

  /* ---------- Engines ---------- */
  async function googleTranslate(text, sl, tl) {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('Google HTTP ' + res.status);
    const data = await res.json();
    return data[0].map(s => s[0]).join('');
  }
  async function myMemoryTranslate(text, sl, tl) {
    let url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${sl}|${tl}`;
    const email = localStorage.getItem(EMAIL_KEY);
    if (email) url += `&de=${encodeURIComponent(email)}`; // 登録メールで上限50,000字/日
    const res = await fetch(url);
    if (!res.ok) throw new Error('MyMemory HTTP ' + res.status);
    const data = await res.json();
    if (data.responseStatus !== 200) throw new Error(data.responseDetails || 'MyMemory error');
    return data.responseData.translatedText;
  }
  const ENGINES = {
    google:   { fn: googleTranslate,   max: 1800, label: 'Google' },
    mymemory: { fn: myMemoryTranslate, max: 450,  label: 'MyMemory' }
  };

  async function translateWith(engineKey, text, sl, tl) {
    const eng = ENGINES[engineKey];
    const chunks = chunkText(text, eng.max);
    const results = await Promise.all(chunks.map(async c => {
      if (!c.trim()) return c;
      const lead = c.match(/^\s*/)[0], trail = c.match(/\s*$/)[0];
      const t = await eng.fn(c.trim(), sl, tl);
      return lead + t + trail;
    }));
    return results.join('');
  }

  async function translate() {
    const text = source.value;
    const lang = updateDirection();
    if (!text.trim() || !lang) {
      setOutput('', true);
      $('engineBadge').textContent = 'READY';
      return;
    }
    const sl = lang, tl = lang === 'ja' ? 'en' : 'ja';
    const myId = ++requestId;
    const primary = $('engine').value;
    const fallback = primary === 'google' ? 'mymemory' : 'google';

    loader.classList.add('show');
    translateBtn.disabled = true;
    try {
      let result, used = primary;
      try {
        result = await translateWith(primary, text, sl, tl);
      } catch (e) {
        console.warn(e);
        used = fallback;
        result = await translateWith(fallback, text, sl, tl);
      }
      if (myId !== requestId) return; // 古いリクエストは破棄
      lastResult = { text: result, lang: tl };
      setOutput(result);
      $('engineBadge').innerHTML = `ENGINE · <em>${ENGINES[used].label}</em>`;
      addHistory(text, result, sl, tl, ENGINES[used].label);
    } catch (e) {
      if (myId !== requestId) return;
      console.error(e);
      toast('⚠ 翻訳に失敗しました。ネット接続を確認してください');
      $('engineBadge').textContent = 'ERROR';
    } finally {
      if (myId === requestId) {
        loader.classList.remove('show');
        translateBtn.disabled = false;
      }
    }
  }

  function setOutput(text, empty = false) {
    if (empty || !text) {
      output.textContent = '翻訳結果がここに表示されます…';
      output.classList.add('placeholder');
      lastResult = { text: '', lang: 'en' };
      $('tgtCount').textContent = '0 文字';
    } else {
      output.textContent = text;
      output.classList.remove('placeholder');
      $('tgtCount').textContent = text.length.toLocaleString() + ' 文字';
    }
  }

  /* ---------- History (翻訳履歴) ---------- */
  const HISTORY_KEY = 'nexus_history';
  const HISTORY_MAX = 200;
  let history = [];
  try { history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch { history = []; }

  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
    catch { history = history.slice(0, 50); localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
    $('historyCount').textContent = history.length;
  }
  function addHistory(src, out, sl, tl, engine) {
    const s = src.trim();
    if (!s) return;
    const entry = { id: Date.now() + Math.random().toString(36).slice(2, 6), src: s, out: out.trim(), sl, tl, engine, time: Date.now() };
    const top = history[0];
    // 入力途中（自動翻訳）の連続保存を1件にまとめる
    if (top && Date.now() - top.time < 120000 && (s.startsWith(top.src) || top.src.startsWith(s))) {
      entry.id = top.id;
      history[0] = entry;
    } else {
      history.unshift(entry);
      if (history.length > HISTORY_MAX) history.length = HISTORY_MAX;
    }
    saveHistory();
    if ($('drawer').classList.contains('open')) renderHistory();
  }
  const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function fmtTime(t) {
    const d = new Date(t), now = new Date();
    const hm = d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return '今日 ' + hm;
    const y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return '昨日 ' + hm;
    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${hm}`;
  }
  function renderHistory() {
    const q = $('historySearch').value.trim().toLowerCase();
    const list = q ? history.filter(h => h.src.toLowerCase().includes(q) || h.out.toLowerCase().includes(q)) : history;
    $('historyInfo').textContent = q ? `${list.length} / ${history.length} 件` : `${history.length} 件`;
    if (!list.length) {
      $('historyList').innerHTML = `<div class="h-empty"><span class="big">${q ? '🔍' : '🕘'}</span>${q ? '一致する履歴がありません' : 'まだ履歴はありません<br>翻訳すると自動で保存されます'}</div>`;
      return;
    }
    $('historyList').innerHTML = list.map(h => `
      <div class="h-item" data-id="${h.id}">
        <div class="h-meta"><span class="h-dir">${h.sl === 'ja' ? '日 → EN' : 'EN → 日'}</span>${fmtTime(h.time)} · ${esc(h.engine || '')}</div>
        <div class="h-src">${esc(h.src)}</div>
        <div class="h-out">${esc(h.out)}</div>
        <div class="h-actions">
          <button class="copy" title="翻訳をコピー"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
          <button class="del" title="削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>
      </div>`).join('');
  }
  function openDrawer() {
    renderHistory();
    $('drawer').classList.add('open');
    $('overlay').classList.add('show');
    setTimeout(() => $('historySearch').focus(), 300);
  }
  function closeDrawer() {
    $('drawer').classList.remove('open');
    $('overlay').classList.remove('show');
  }
  $('historyBtn').addEventListener('click', openDrawer);
  $('closeDrawer').addEventListener('click', closeDrawer);
  $('overlay').addEventListener('click', closeDrawer);
  $('historySearch').addEventListener('input', renderHistory);
  $('historyList').addEventListener('click', async e => {
    const item = e.target.closest('.h-item');
    if (!item) return;
    const h = history.find(x => x.id === item.dataset.id);
    if (!h) return;
    if (e.target.closest('.del')) {
      history = history.filter(x => x.id !== h.id);
      saveHistory(); renderHistory();
      return toast('🗑 履歴を削除しました');
    }
    if (e.target.closest('.copy')) {
      try { await navigator.clipboard.writeText(h.out); toast('✔ 翻訳をコピーしました'); }
      catch { toast('コピーに失敗しました'); }
      return;
    }
    // 履歴を復元
    stopSpeaking();
    requestId++;
    clearTimeout(debounceTimer);
    source.value = h.src;
    updateDirection();
    setOutput(h.out);
    lastResult = { text: h.out, lang: h.tl };
    $('engineBadge').innerHTML = `HISTORY · <em>${esc(h.engine || '')}</em>`;
    closeDrawer();
    toast('🕘 履歴を復元しました');
  });
  $('clearHistory').addEventListener('click', () => {
    if (!history.length) return;
    if (!confirm('翻訳履歴をすべて削除しますか？')) return;
    history = [];
    saveHistory(); renderHistory();
    toast('履歴をすべて削除しました');
  });

  /* ---------- Speech output (音声読み上げ) ---------- */
  let voices = [];
  const loadVoices = () => { voices = speechSynthesis.getVoices(); };
  if ('speechSynthesis' in window) {
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  function pickVoice(lang) {
    const prefix = lang === 'ja' ? 'ja' : 'en';
    const list = voices.filter(v => v.lang.toLowerCase().startsWith(prefix));
    const prefer = ['Natural', 'Online', 'Google', 'Neural', 'Kyoko', 'Samantha'];
    for (const key of prefer) {
      const v = list.find(v => v.name.includes(key) && (prefix !== 'en' || /US|GB/i.test(v.lang)));
      if (v) return v;
    }
    return list[0] || null;
  }
  let speakingBtn = null;
  function stopSpeaking() {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    if (speakingBtn) speakingBtn.classList.remove('speaking');
    speakingBtn = null;
  }
  function speak(text, lang, btn) {
    if (!('speechSynthesis' in window)) return toast('このブラウザは音声読み上げに対応していません');
    if (speakingBtn === btn) { stopSpeaking(); return; }
    stopSpeaking();
    if (!text.trim()) return toast('読み上げるテキストがありません');
    const voice = pickVoice(lang);
    // Chromeの長文途切れ対策：文単位で分割して順次再生
    const sentences = chunkText(text, 180).filter(s => s.trim());
    speakingBtn = btn; btn.classList.add('speaking');
    sentences.forEach((s, i) => {
      const u = new SpeechSynthesisUtterance(s);
      u.lang = lang === 'ja' ? 'ja-JP' : 'en-US';
      if (voice) u.voice = voice;
      u.rate = parseFloat($('rate').value);
      if (i === sentences.length - 1) u.onend = () => { if (speakingBtn === btn) stopSpeaking(); };
      u.onerror = () => { if (speakingBtn === btn) stopSpeaking(); };
      speechSynthesis.speak(u);
    });
  }

  /* ---------- Voice input (音声入力) ----------
     ・ブラウザ標準 (Web Speech API)：Chrome / Edge / Safari でリアルタイム認識
     ・Whisper (transformers.js)：ブラウザ内AIで認識。Opera / Brave / Firefox など全ブラウザ対応
  */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  // Opera・Brave・Vivaldi は API は存在するが Google の認識サーバーが使えないため動かない
  const NATIVE_UNSUPPORTED = !!navigator.brave || /OPR\/|Opera|Vivaldi/i.test(navigator.userAgent);
  let rec = null, listening = false, baseText = '';
  const MIC_LANG_KEY = 'nexus_mic_lang', SR_ENGINE_KEY = 'nexus_sr_engine', NATIVE_FAIL_KEY = 'nexus_native_sr_failed';
  $('micLang').value = localStorage.getItem(MIC_LANG_KEY) || 'ja-JP';
  $('srEngine').value = localStorage.getItem(SR_ENGINE_KEY) || 'auto';
  $('micLang').addEventListener('change', e => {
    localStorage.setItem(MIC_LANG_KEY, e.target.value);
    if (listening) { stopListening(true); setTimeout(startListening, 300); }
  });
  $('srEngine').addEventListener('change', e => {
    localStorage.setItem(SR_ENGINE_KEY, e.target.value);
    if (listening) stopListening(true);
    const eng = resolveEngine();
    if (eng) toast(eng === 'native' ? '🎤 ブラウザ標準の音声認識を使用します'
      : '🎤 Whisper（ブラウザ内AI）で音声認識します — 初回のみモデルをダウンロードします');
  });

  function resolveEngine() {
    const v = $('srEngine').value;
    if (v === 'auto') return (SR && !NATIVE_UNSUPPORTED && !localStorage.getItem(NATIVE_FAIL_KEY)) ? 'native' : 'whisper-base';
    if (v === 'native' && !SR) { toast('このブラウザには標準の音声認識がありません。Whisper を選択してください'); return null; }
    return v;
  }
  function setListeningUI(on, label) {
    $('micGroup').classList.toggle('listening', on);
    $('srcPanel').classList.toggle('recording', on);
    $('micLabel').textContent = on ? '停止' : '音声入力';
    $('recText').textContent = label || 'REC 録音中…';
  }
  function prepareBase(lang) {
    const cur = source.value.replace(/\s+$/, '');
    baseText = cur ? cur + (lang.startsWith('ja') ? '\n' : ' ') : '';
  }
  function startListening() {
    stopSpeaking();
    const eng = resolveEngine();
    if (!eng) return;
    if (eng === 'native') startNative(); else startWhisper(eng);
  }
  function stopListening(cancel = false) {
    if (rec) { if (cancel) rec.abort(); else rec.stop(); }
    if (wRec) stopWhisper({ cancel });
  }
  function toggleMic() { listening ? stopListening() : startListening(); }
  $('micBtn').addEventListener('click', toggleMic);

  /* ----- ブラウザ標準 (Chrome / Edge) ----- */
  function startNative() {
    const lang = $('micLang').value;
    const sep = lang.startsWith('ja') ? '' : ' ';
    prepareBase(lang);

    rec = new SR();
    rec.lang = lang;
    rec.continuous = true;
    rec.interimResults = true;
    let lastFinal = '', switchToWhisper = false;

    rec.onstart = () => { listening = true; setListeningUI(true); toast(`🎤 ${lang.startsWith('ja') ? '日本語' : 'English'}で話してください`); };
    rec.onresult = e => {
      let finals = [], interim = '';
      for (let i = 0; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finals.push(r[0].transcript.trim());
        else interim += r[0].transcript;
      }
      const finalText = finals.join(sep);
      source.value = baseText + finalText + (interim ? (finalText ? sep : '') + interim.trim() : '');
      source.scrollTop = source.scrollHeight;
      updateDirection();
      if (finalText !== lastFinal) {
        lastFinal = finalText;
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(translate, 400); // 話した言葉をそのまま翻訳
      }
    };
    rec.onerror = e => {
      // 標準認識が使えないブラウザ → 自動モードなら Whisper に切り替え
      if (['network', 'service-not-allowed', 'language-not-supported'].includes(e.error) && $('srEngine').value === 'auto') {
        localStorage.setItem(NATIVE_FAIL_KEY, '1');
        switchToWhisper = true;
        toast('ブラウザ標準の音声認識が使えないため、Whisper（ブラウザ内AI）に切り替えます');
        return;
      }
      const msg = {
        'not-allowed': '⚠ マイクの使用が許可されていません（アドレスバーの🔒から許可してください）',
        'service-not-allowed': '⚠ 音声認識サービスが利用できません（設定で Whisper を選択してください）',
        'no-speech': '音声が検出されませんでした',
        'audio-capture': '⚠ マイクが見つかりません',
        'network': '⚠ 音声認識サービスに接続できません（設定で Whisper を選択してください）'
      }[e.error];
      if (msg) toast(msg);
    };
    rec.onend = () => {
      listening = false; setListeningUI(false); rec = null;
      if (switchToWhisper) { startWhisper('whisper-base'); return; }
      if (source.value.trim()) { clearTimeout(debounceTimer); translate(); }
    };
    try { rec.start(); } catch (err) { console.error(err); }
  }

  /* ----- Whisper（全ブラウザ対応・ブラウザ内AI） ----- */
  const TRANSFORMERS_URL = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3/dist/transformers.min.js';
  const WHISPER_MODELS = {
    'whisper-tiny':  'Xenova/whisper-tiny',
    'whisper-base':  'Xenova/whisper-base',
    'whisper-small': 'Xenova/whisper-small'
  };
  const whisperCache = {};
  let wRec = null, modelPct = null, srcLoaderOn = false;
  // 無音時に Whisper が出しがちな定型文を除外
  const HALLUCINATION = /^[\s。、.!！]*(ご視聴ありがとうございました|チャンネル登録.*|字幕.*|thanks for watching|\[.*\]|\(.*\)|（.*）)[\s。、.!！]*$/i;

  function onModelProgress(pct) {
    modelPct = pct;
    if (wRec) $('recText').textContent = pct == null ? 'REC 録音中…' : `REC 録音中…（AIモデル準備 ${pct}%）`;
    if (srcLoaderOn) $('srcLoaderText').textContent = pct == null ? '文字起こし中…' : `音声AIモデルをダウンロード中… ${pct}%`;
  }
  function showSrcLoader(on) {
    srcLoaderOn = on;
    $('srcLoader').classList.toggle('show', on);
    if (on) onModelProgress(modelPct);
  }
  function loadWhisper(key) {
    if (!whisperCache[key]) {
      whisperCache[key] = (async () => {
        const { pipeline, env } = await import(TRANSFORMERS_URL);
        env.allowLocalModels = false;
        const files = {};
        const asr = await pipeline('automatic-speech-recognition', WHISPER_MODELS[key], {
          dtype: 'q8', device: 'wasm',
          progress_callback: p => {
            if (p.status === 'progress' && p.total) {
              files[p.file] = [p.loaded, p.total];
              let l = 0, t = 0;
              for (const [a, b] of Object.values(files)) { l += a; t += b; }
              onModelProgress(Math.round(l / t * 100));
            }
          }
        });
        onModelProgress(null);
        return asr;
      })().catch(err => { delete whisperCache[key]; onModelProgress(null); throw err; });
    }
    return whisperCache[key];
  }

  async function startWhisper(key) {
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return toast('このブラウザはマイク録音に未対応です');
    const lang = $('micLang').value;
    loadWhisper(key).catch(err => console.error(err)); // 録音中にモデルを先読み
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch (e) {
      return toast(e.name === 'NotAllowedError'
        ? '⚠ マイクの使用が許可されていません（アドレスバーの🔒から許可してください）'
        : '⚠ マイクが見つかりません');
    }
    prepareBase(lang);
    const recorder = new MediaRecorder(stream);
    const st = { stream, recorder, chunks: [], ctx: null, raf: 0, spoke: false, lastVoice: 0, started: performance.now(), lang, key };
    wRec = st;
    recorder.ondataavailable = e => { if (e.data.size) st.chunks.push(e.data); };
    recorder.onstop = () => transcribeWhisper(st);
    recorder.start();

    // 無音検出：話し終わって約1.8秒静かになったら自動で停止→文字起こし
    try {
      const ctx = new AudioContext(); st.ctx = ctx;
      const an = ctx.createAnalyser(); an.fftSize = 1024;
      ctx.createMediaStreamSource(stream).connect(an);
      const buf = new Float32Array(an.fftSize);
      const tick = () => {
        if (wRec !== st) return;
        an.getFloatTimeDomainData(buf);
        let sum = 0; for (const v of buf) sum += v * v;
        const rms = Math.sqrt(sum / buf.length), now = performance.now();
        if (rms > 0.015) { st.spoke = true; st.lastVoice = now; }
        if (st.spoke && now - st.lastVoice > 1800) return stopWhisper();
        if (!st.spoke && now - st.started > 10000) return stopWhisper({ noSpeech: true });
        if (now - st.started > 120000) return stopWhisper();
        st.raf = requestAnimationFrame(tick);
      };
      tick();
    } catch (err) { console.warn(err); }

    listening = true;
    setListeningUI(true, modelPct == null ? '' : `REC 録音中…（AIモデル準備 ${modelPct}%）`);
    toast(`🎤 ${lang.startsWith('ja') ? '日本語' : 'English'}で話してください（話し終わると自動で文字起こし）`);
  }

  function stopWhisper({ cancel = false, noSpeech = false } = {}) {
    const st = wRec;
    if (!st) return;
    wRec = null;
    st.cancel = cancel; st.noSpeech = noSpeech;
    cancelAnimationFrame(st.raf);
    if (st.recorder.state !== 'inactive') st.recorder.stop();
    st.stream.getTracks().forEach(t => t.stop());
    if (st.ctx) st.ctx.close().catch(() => {});
    listening = false;
    setListeningUI(false);
  }

  async function transcribeWhisper(st) {
    if (st.cancel) return;
    if (st.noSpeech) return toast('音声が検出されませんでした');
    showSrcLoader(true);
    try {
      const blob = new Blob(st.chunks, { type: st.recorder.mimeType });
      const actx = new AudioContext({ sampleRate: 16000 }); // Whisper は 16kHz
      const decoded = await actx.decodeAudioData(await blob.arrayBuffer());
      actx.close().catch(() => {});
      const audio = decoded.getChannelData(0);
      if (audio.length < 16000 * 0.3) return toast('録音が短すぎます');
      const asr = await loadWhisper(st.key);
      $('srcLoaderText').textContent = '文字起こし中…';
      await new Promise(r => setTimeout(r, 30)); // 表示更新
      const out = await asr(audio, {
        language: st.lang.startsWith('ja') ? 'japanese' : 'english',
        task: 'transcribe', chunk_length_s: 30, stride_length_s: 5
      });
      const text = (out.text || '').trim();
      if (!text || HALLUCINATION.test(text)) return toast('音声を認識できませんでした');
      source.value = baseText + text;
      source.scrollTop = source.scrollHeight;
      updateDirection();
      clearTimeout(debounceTimer);
      translate(); // 話した言葉をそのまま翻訳
    } catch (e) {
      console.error(e);
      toast('⚠ 文字起こしに失敗しました（初回はAIモデルのダウンロードにネット接続が必要です）');
    } finally {
      showSrcLoader(false);
    }
  }

  /* ---------- Events ---------- */
  source.addEventListener('input', () => {
    updateDirection();
    if ($('autoToggle').checked) {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(translate, 700);
    }
  });
  source.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); clearTimeout(debounceTimer); translate(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('drawer').classList.contains('open')) closeDrawer();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'm') { e.preventDefault(); toggleMic(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'h') {
      e.preventDefault();
      $('drawer').classList.contains('open') ? closeDrawer() : openDrawer();
    }
  });
  translateBtn.addEventListener('click', () => { clearTimeout(debounceTimer); translate(); });

  $('pasteBtn').addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (!text) return toast('クリップボードが空です');
      const s = source.selectionStart, e = source.selectionEnd;
      source.value = source.value.slice(0, s) + text + source.value.slice(e);
      source.focus();
      toast('📋 貼り付けました');
      clearTimeout(debounceTimer);
      translate();
    } catch {
      source.focus();
      toast('Ctrl + V で貼り付けてください（ブラウザが許可していません）');
    }
  });

  $('clearBtn').addEventListener('click', () => {
    stopSpeaking();
    stopListening(true);
    requestId++;
    clearTimeout(debounceTimer);
    loader.classList.remove('show');
    translateBtn.disabled = false;
    source.value = '';
    setOutput('', true);
    updateDirection();
    $('engineBadge').textContent = 'READY';
    source.focus();
  });

  $('speakSrcBtn').addEventListener('click', e => {
    speak(source.value, detectLang(source.value) || 'en', e.currentTarget);
  });
  $('speakTgtBtn').addEventListener('click', e => {
    speak(lastResult.text, lastResult.lang, e.currentTarget);
  });
  $('copyBtn').addEventListener('click', async () => {
    if (!lastResult.text) return toast('コピーする翻訳がありません');
    try { await navigator.clipboard.writeText(lastResult.text); toast('✔ 翻訳をコピーしました'); }
    catch { toast('コピーに失敗しました'); }
  });
  $('engine').addEventListener('change', () => { if (source.value.trim()) translate(); });

  $('mmSave').addEventListener('click', saveEmail);
  $('mmEmail').addEventListener('keydown', e => { if (e.key === 'Enter') saveEmail(); });
  $('mmEmail').addEventListener('input', e => e.target.classList.remove('invalid'));
  $('mmRemove').addEventListener('click', () => {
    localStorage.removeItem(EMAIL_KEY);
    refreshEmailUI();
    toast('登録を解除しました（5,000字/日）');
  });

  refreshEmailUI();
  $('historyCount').textContent = history.length;
  updateDirection();
  source.focus();
})();
</script>
</body>
</html>
